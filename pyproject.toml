[project]
name = "pycan-web"
version = "1.0.0"
description = "Python Canarias Web Site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorama==0.4.6",
    "django==6.1.1",
    "django-colorfield==0.14.0",
    "django-debug-toolbar>=4.3.0",
    "django-extensions==4.1",
    "django-import-export==4.4.1",
    "django-leaflet==0.34.0",
    "django-redis==7.0.0",
    "django-rq==4.2.0",
    "markdown2==2.5.5",
    "markuppy==1.18",
    "odfpy==1.4.1",
    "openpyxl>=3.1.15",
    "pillow>=12.3.0",
    "prettyconf==3.1.0",
    "psycopg2>=2.9.13",
    "pydotplus>=2.0.2",
    "pygal>=3.1.3",
    "pyqrcode==1.2.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-sugar>=1.1.1",
    "pyyaml==6.0.3",
    "qr==0.6.0",
    "redis==8.1.0",
    "reportlab==5.0.1",
    "rq==2.12.1",
    "sendgrid==6.12.5",
    "stripe>=15.6.1",
    "tabulate==0.10.0",
    "uwsgi==2.0.31",
    "werkzeug>=3.1.8",
    "xlrd==2.0.2",
    "xlwt==1.3.0",
]

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "rope>=1.14.0",
    "flake8>=7.3.0",
    "black>=26.5.1",
    "vulture>=2.16",
    "icecream",
]
