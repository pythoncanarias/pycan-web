name: CI
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy project
    runs-on: ubuntu-latest
    steps:
      - name: Just testing this is running
        run: echo "Hello, world"
      - name: Execute remote deploy commands
        uses: appleboy/ssh-action@master
        with:
          host: pythoncanarias.es
          username: ${{ secrets.PRODUCTION_SSH_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          passphrase: ${{ secrets.PASS_PHRASE }}
          #script: cd ~/apps/www.pythoncanarias.es/ && ./deploy.sh
          script: cd ~/apps/www.pythoncanarias.es/ && pwd
