{% if breadcrumbs %}
<nav id="breadcrumbs"
     class="breadcrumb has-succeeds-separator"
     aria-label="breadcrumbs">
  <ul>
    <li><a href="/">
      <i class="fa-solid fa-house"></i>
      </a>
    </li>
{% for bc in breadcrumbs %}
  {% if forloop.last %}
    <li class="is-active">
      <b><a href=#">{{ bc.label|safe }}</a></b>
    </li>
  {% else %}
    <li>
      <a href="{{ bc.url }}">{{ bc.label|safe }}</a>
    </li>
  {% endif %}
{% endfor %}
  </ul>
</nav>
{% endif %}
