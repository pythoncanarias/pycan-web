{% load static utils %}

<nav class="header-page navbar is-paddingless is-fixed-top">
  <div class="navbar-brand">
    <a class="navbar-item" href="/">
      <img id="python-canarias-logo"
           src="{% static 'commons/img/logo-python-canarias-white.svg' %}"
           alt="{{ organization.name }}">
    </a>

    <a role="button" class="navbar-burger" data-target="navMenu" aria-label="menu" aria-expanded="false">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </a>
  </div>

  <div class="navbar-menu" id="navMenu">
    <div class="navbar-end">
      <div class="navbar-item has-dropdown is-hoverable">


        <a class="navbar-item  {% is_active 'about:index' %} js-nav-item" href="{% url 'about:index' %}">
          <i class="fas fa-user-friends"></i>
         Asociación
         </a>
          <div class="navbar-dropdown is-boxed js-nav-dropdown collapsable--close">
              <a class="navbar-item {% is_active 'about:us' %}" href="{% url 'about:us' %}">Información</a>
              <a class="navbar-item {% is_active 'about:history' %}" href="{% url 'about:history' %}">Historia</a>
              <a class="navbar-item {% is_active 'about:join' %}" href="{% url 'about:join' %}">¡Únete!</a>
              <a class="navbar-item {% is_active 'about:allies' %}" href="{% url 'about:allies' %}">Aliados</a>
              <a class="navbar-item {% is_active 'about:faq' %}" href="{% url 'about:faq' %}">FAQ</a>
          </div>
      </div>
      <div class="navbar-item has-dropdown is-hoverable">
          <a class="navbar-item {% is_active 'events:index' %} js-nav-item" href="{% url 'events:index' %}">
          <i class="fas fa-birthday-cake"></i>
          Eventos
          </a>
          <div class="navbar-dropdown is-boxed js-nav-dropdown collapsable--close">
            <a class="navbar-item {% is_active 'events:next' %}" href="{% url 'events:next' %}">Próximo evento</a>
            <a class="navbar-item {% is_active 'events:past_events' %}" href="{% url 'events:past_events' %}">Eventos pasados</a>
            </div>
      </div>

      <a class="navbar-item {% is_active 'jobs:index' %}" href="{% url 'jobs:index' %}">
          <i class="fas fa-laptop-code"></i>
          Empleo
      </a>

      <a class="navbar-item {% is_active 'learn:index' %}" href="{% url 'learn:index' %}">
          <i class="fas fa-graduation-cap"></i>
          Aprende
      </a>

      {% if request.user.is_authenticated %}
        <a class="navbar-item {% is_active 'members:homepage' %}"
           href="{% url 'members:homepage' %}"
          title="{{ request.user.username }}"
          >
          <i class="fa fa-user-circle" aria-hidden="true"></i>
          Perfil
        </a>
      {% else %}
        <a class="navbar-item" href="{% url 'members:member_login' %}">
          <i class="fas fa-sign-in-alt"></i>
        </a>
      {% endif %}
        <a class="navbar-item js-nav-item" id="switch-theme-button">
          <i class="fa-solid fa-sun" id="switch-theme-icon-day"></i>
          <i class="fa-solid fa-moon" id="switch-theme-icon-night"></i>
        </a>

    </div>
  </div>
  </div>
</nav>
